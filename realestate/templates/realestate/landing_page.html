<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yousuf Bin Nasser & Sons Real Estate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #D4AF37;
            --dark-bg: #0a0a0a;
            --text-light: #ffffff;
            --text-muted: #a3a3a3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Background Design Elements */
        .bg-pattern {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle at top right, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                              radial-gradient(circle at bottom left, rgba(255, 255, 255, 0.03) 0%, transparent 30%);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px 20px;
            max-width: 800px;
            width: 100%;
        }

        /* Branding */
        .logo-box {
            width: 80px;
            height: 80px;
            border: 2px solid var(--primary-gold);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 2.5rem;
            color: var(--primary-gold);
            background: rgba(212, 175, 55, 0.05);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
        }

        .brand-name {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 15px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .tagline {
            font-size: 1.1rem;
            font-weight: 300;
            color: var(--primary-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 60px;
        }

        /* Action Buttons */
        .login-grid {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .login-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 20px 30px;
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            min-width: 180px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .login-btn i {
            font-size: 1.8rem;
            color: var(--text-muted);
            transition: color 0.3s ease;
        }

        .login-btn:hover {
            border-color: var(--primary-gold);
            background: rgba(212, 175, 55, 0.05);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .login-btn:hover i {
            color: var(--primary-gold);
        }

        @media (max-width: 600px) {
            .brand-name { font-size: 1.8rem; }
            .tagline { font-size: 0.9rem; margin-bottom: 40px; }
            .login-btn { width: 100%; min-width: unset; flex-direction: row; justify-content: center; padding: 15px; }
            .login-btn i { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="bg-pattern"></div>

    <div class="container">
        <div class="logo-box">
            <i class="fa-solid fa-gem"></i>
        </div>

        <h1 class="brand-name">Yousuf Bin Nasser & Sons<br>Real Estate</h1>
        <p class="tagline">Tradition and Values, Driven by a New Vision</p>

        <div class="login-grid">
            <a href="{% url 'login' %}?role=Admin" class="login-btn">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Login as Admin</span>
            </a>

            <a href="{% url 'login' %}?role=Owner" class="login-btn" style="border-color: rgba(212,175,55,0.3);">
                <i class="fa-solid fa-building-user" style="color: var(--primary-gold);"></i>
                <span>Login as Owner</span>
            </a>

            <a href="{% url 'login' %}?role=Tenant" class="login-btn">
                <i class="fa-solid fa-key"></i>
                <span>Login as Tenant</span>
            </a>
        </div>
    </div>

</body>
</html>
